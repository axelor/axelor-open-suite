---
title: "Product: added a manual merge of two products, transferring the references of the absorbed product to the kept one, archiving the absorbed product and recording the operation in a merge log."
module: axelor-supplychain
developer: |
  Added the entity ProductMergeLog, the field Product.mergedIntoProduct and the
  configuration AppSupplychain.productMergeAuthorizedUserSet, which lists the users
  allowed to run a product merge.

  New menu entry "Product merge logs" under Referential > Products.

  The absorbed product shows a "Product merge" tab with the link to the product it
  was merged into. The tab is hidden on products that were never merged.
