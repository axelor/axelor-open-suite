title: "Bank reconciliation: fixed computed balances for unreconciled and ongoing amounts with multi-currency accounts."
module: axelor-bank-payment
developer: |
  BankReconciliationBalanceComputationServiceImpl:
  - constructor: no longer takes AccountService, BankReconciliationLineRepository, CurrencyService, DateService; now takes BankReconciliationQueryService.
