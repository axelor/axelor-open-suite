  - computeAccountBalance: added; replaces AccountService.computeBalance, using the same currency rule as movesTheoreticalBalance.
  - getConvertedAmount: removed.

  BankReconciliationQueryService:
  - getDateRange: added; shares the margin-widened date range between getBindRequestMoveLine and computeBalances.
