---
title: "Payment session: fixed the unbalanced or blocked payment move when a financial discount with VAT is applied."
module: axelor-account
developer: |
  The following protected methods were removed from `PaymentSessionValidateServiceImpl`, as the
  financial discount VAT lines are already generated by `MoveLineFinancialDiscountService`:

  - `generateTaxMoveLines(Map)`.
  - `extractTaxLinesFromFinancialDiscountLines(Move)`.
  - `applyTaxes(Map)`.

  Implementations overriding these methods must remove their overrides.
