title: "Supplier arrival: added a supplier delivery date on the reception, distinct from the move date, to record the actual date the goods were delivered. The supplier on-time delivery rate is now computed from this date, falling back to the move date when it is not filled."
module: axelor-stock
developer: |
  Added the `supplierDeliveryDate` date field to `StockMove`.

  -- Script
  ALTER TABLE stock_stock_move ADD COLUMN supplier_delivery_date date;
