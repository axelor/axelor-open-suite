---
title: "Views: removed the duplicate definitions of the action 'action-prod-process-method-compute-hazard-phrases' and the view 'invoice-line-form', so that the sub invoice lines panel is displayed on the invoice line form."
module: axelor-supplychain
developer: |
  The view 'invoice-line-form' of the supplychain module is now an extension with the id
  'supplychain-invoice-line-form', and the duplicate declaration of the action
  'action-prod-process-method-compute-hazard-phrases' is removed. The following script removes the
  records that may have been stored for these duplicates. Restart the application or restore all
  views afterwards so that the invoice line form is computed again.

  ```sql
  DELETE FROM meta_view
  WHERE name = 'invoice-line-form'
    AND module = 'axelor-supplychain'
    AND xml_id IS NULL;

  DELETE FROM meta_action duplicate
  USING meta_action original
  WHERE duplicate.name = 'action-prod-process-method-compute-hazard-phrases'
    AND original.name = duplicate.name
    AND original.id < duplicate.id;
  ```
